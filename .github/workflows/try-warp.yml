name: Try WARP
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet requests pyyaml
      - name: Start WARP
        uses: fscarmen/warp-on-actions@v1.3
        with:
          mode: proxy
      - name: Show egress IP
        run: curl -sS --max-time 10 https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(ip|loc)="
      - name: Fetch subscription
        run: python sync_mihomo.py
