name: Try WARP
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet requests pyyaml
      - name: Start WARP (wireguard)
        uses: fscarmen/warp-on-actions@v1.3
        with:
          mode: wireguard
      - name: Show egress IP
        run: |
          echo "--- direct ---"
          curl -sS --max-time 15 https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(ip|loc)=" || true
          echo "--- proxy 40000 ---"
          curl -sS --max-time 15 -x socks5h://127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(ip|loc)=" || echo "socks5 40000 unavailable"
      - name: Fetch subscription (direct)
        run: python sync_mihomo.py
      - name: Fetch subscription (via socks5)
        continue-on-error: true
        env:
          ALL_PROXY: socks5h://127.0.0.1:40000
        run: python sync_mihomo.py
