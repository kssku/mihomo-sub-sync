name: Sync Mihomo Subscription

# 抓取在住宅 IP 的本地机器执行（cron 04:17）。
# GitHub Actions 出口 IP 被机场拦截，无法直连订阅源。
# 本工作流仅保留手动触发作为应急手段。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Notice
        run: |
          echo "自动同步由本地 cron 完成，本工作流仅作应急手动触发。"
