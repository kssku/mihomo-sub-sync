name: Try Proxy
on: workflow_dispatch
permissions:
  contents: write
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet requests pyyaml
      - name: Download mihomo
        run: |
          mkdir -p /tmp/mm
          URL=$(curl -sSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep -o "https://[^"]*linux-amd64-compatible[^"]*\.gz" | head -1)
          echo "asset=$URL"
          curl -sSL -o /tmp/mm/mm.gz "$URL"
          gunzip -f /tmp/mm/mm.gz && chmod +x /tmp/mm/mm
          /tmp/mm/mm -v
      - name: Start mihomo
        env:
          PROXY_SUB: ${{ secrets.PROXY_SUB }}
        run: |
          curl -sSL -o /tmp/mm/config.yaml "$PROXY_SUB"
          printf "\nmixed-port: 7890\nallow-lan: false\nlog-level: info\n" >> /tmp/mm/config.yaml
          nohup /tmp/mm/mm -d /tmp/mm -f /tmp/mm/config.yaml > /tmp/mm/log 2>&1 &
          sleep 10
          tail -20 /tmp/mm/log
      - name: Egress IP via proxy
        run: curl -sS --max-time 20 -x http://127.0.0.1:7890 https://api.ipify.org; echo
      - name: Fetch subscription
        env:
          HTTP_PROXY: http://127.0.0.1:7890
          HTTPS_PROXY: http://127.0.0.1:7890
        run: python sync_mihomo.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clash_proxies_latest.yaml archive 2>/dev/null || true
          if git diff --staged --quiet; then echo "no changes"; else git commit -m "chore: try proxy sync" && git push; fi
